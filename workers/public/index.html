<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marking Worker — Logs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0f;
    color: #d4d4d8;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13px;
    padding: 20px 24px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #26262b;
  }
  h1 { font-size: 14px; font-weight: 600; color: #f4f4f5; }
  .status { font-size: 12px; color: #6b7280; }
  .status.live { color: #34d399; }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <header>
    <h1>Marking Worker — Logs</h1>
    <span class="status" id="status">connecting…</span>
  </header>
  <pre id="log">Loading…</pre>

<script>
  const logEl = document.getElementById('log')
  const statusEl = document.getElementById('status')

  async function refresh() {
    try {
      const res = await fetch('/api/logs')
      logEl.textContent = await res.text()
      statusEl.textContent = 'live — refreshing every 3s'
      statusEl.className = 'status live'
    } catch (err) {
      statusEl.textContent = 'disconnected — retrying…'
      statusEl.className = 'status'
    }
  }

  refresh()
  setInterval(refresh, 3000)
</script>
</body>
</html>
