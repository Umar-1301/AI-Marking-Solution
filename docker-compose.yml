# Local development services.
#
# Postgres here is the local stand-in for Azure Database for PostgreSQL — same
# engine and wire protocol, so code that works against this works in Azure. The
# named volume persists data across restarts (so we can prove persistence, the
# whole reason for moving off the ephemeral SQLite file).
#
#   docker compose up -d postgres
#   DATABASE_URL=postgres://aimira:localdevpassword@localhost:5432/aimira
#
# Credentials here are LOCAL-DEV ONLY. Azure uses a Flexible Server host with
# sslmode=require and credentials from Key Vault.

services:
  postgres:
    image: postgres:16
    container_name: aimira-postgres
    environment:
      POSTGRES_USER: aimira
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: aimira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimira -d aimira"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local stand-in for Azure SQL Database — same engine (SQL Server), same
  # T-SQL dialect, so backend/db/schema.sql and every query in backend/src/db
  # apply unchanged. Only used when the local .env sets SQL_USER/SQL_PASSWORD
  # (see backend/src/db/index.js) — production never sets those, so it always
  # authenticates against the real Azure SQL server with Entra ID instead,
  # completely unaffected by this container's existence.
  #
  #   docker compose up -d mssql      # start the container
  #   cd backend && npm run db:init   # then, once: create the DB + apply schema.sql
  #
  # MSSQL_PID=Developer — the free, full-featured edition, licensed for
  # non-production use only (fine here, this never runs in Azure).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aimira-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Matches backend/.env's SQL_PASSWORD — local-dev only, never used in Azure.
      MSSQL_SA_PASSWORD: "AimiraDevingAbout123!"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      # Plain TCP probe rather than sqlcmd — the exact sqlcmd path
      # (mssql-tools vs mssql-tools18) has changed across image versions, a
      # TCP check works the same regardless. start_period gives the engine
      # room for its slow first-boot initialization before failures count.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Local stand-in for Azure Blob Storage — same Blob REST API (SAS tokens,
  # containers, blobs all behave the same), so the SAS-based upload flow this
  # app is moving to can be built and exercised entirely locally before any
  # Azure Storage account exists. Only used when the local .env points
  # AZURE_STORAGE_CONNECTION_STRING at Azurite's well-known dev connection
  # string — production points it at the real Storage account instead,
  # completely unaffected by this container's existence.
  #
  # Blob service only (azurite-blob, not the default azurite entrypoint) —
  # nothing in the plan needs the Queue or Table emulators yet.
  #
  #   docker compose up -d azurite
  #
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: aimira-azurite
    # --skipApiVersionCheck: client tooling (az CLI, SDKs) sends a storage API
    # version newer than this pinned Azurite build recognizes even though the
    # actual request shape is compatible — this is Azurite's own documented
    # flag for that mismatch, not a functionality trade-off.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --debug /data/debug.log --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azuritedata:/data
    healthcheck:
      # TCP probe via node rather than curl/nc/bash's /dev/tcp — the image is
      # a plain node runtime (that's what runs Azurite itself), so node is
      # the one thing guaranteed present.
      test: ["CMD-SHELL", "node -e \"require('net').createConnection(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mssqldata:
  azuritedata:
